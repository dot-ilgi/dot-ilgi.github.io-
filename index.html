/* 둥근모(Neo둥근모, OFL) — fonts/OFL.txt */
@font-face{font-family:'NeoDunggeunmo';font-weight:normal;font-style:normal;font-display:swap;
  src:url('fonts/neodgm.woff2') format('woff2'),url('fonts/neodgm.woff') format('woff')}
:root{
  --bg:#1c1a33; --dot:#2a2750; --surf:#2b2850; --surf2:#3a3668; --line:#0d0c1d;
  --ink:#fff6e3; --ink2:#d6cfee; --ink3:#9c95c4;
  --yel:#ffd23f; --pink:#ff6fa8; --mint:#5fe3b5;
  --f:'NeoDunggeunmo',ui-monospace,monospace;
  --p:4px; /* 픽셀 한 칸 */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;letter-spacing:0;
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.5px);background-size:16px 16px;
  padding:max(28px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
a{color:inherit;text-decoration:none}
img{image-rendering:pixelated}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:36px}

/* 픽셀 테두리: 모서리 한 칸씩 깎인 박스 + 계단 그림자 */
.px{position:relative;background:var(--surf);
  box-shadow:
    0 calc(var(--p)*-1) 0 0 var(--line), 0 var(--p) 0 0 var(--line),
    calc(var(--p)*-1) 0 0 0 var(--line), var(--p) 0 0 0 var(--line),
    calc(var(--p)*2) calc(var(--p)*2) 0 0 var(--line);}

header{display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;flex:none;display:grid;place-items:center;background:var(--yel)}
.logo img{width:40px;height:40px}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-size:32px;font-weight:normal;line-height:1.1;color:var(--ink);
  text-shadow:var(--p) var(--p) 0 var(--line)}
.brand p{margin:6px 0 0;font-size:16px;color:var(--yel)}
.brand p b{font-weight:normal;color:var(--ink3)}

.hud{display:flex;justify-content:space-between;gap:12px;font-size:16px;color:var(--ink3)}
.hud span i{font-style:normal;color:var(--mint)}

/* RPG 대화창 */
.talk{padding:16px 18px 20px}
.talk .who{position:absolute;top:-18px;left:12px;background:var(--pink);color:var(--line);padding:0 10px;font-size:16px;line-height:28px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}
.talk p{margin:8px 0 0;color:var(--ink2);word-break:keep-all}
.talk .caret{position:absolute;right:14px;bottom:6px;color:var(--yel);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.label{margin:0 0 16px;font-size:16px;color:var(--yel)}
.label::before{content:'▶ '}

.feat{display:block;transition:transform .1s steps(2)}
.feat:hover,.feat:focus-visible{transform:translate(-4px,-4px);outline:none}
.feat:active{transform:translate(4px,4px)}
.shot{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surf2);border-bottom:var(--p) solid var(--line)}
.feat .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.feat h2{margin:0;font-size:32px;font-weight:normal;line-height:1.2}
.feat p{margin:0;color:var(--ink2);word-break:keep-all}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{color:var(--mint);font-size:16px}
.tag::before{content:'#'}
.start{background:var(--yel);color:var(--line);padding:4px 14px;line-height:28px;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),4px 8px 0 0 var(--line)}
.feat:hover .start{background:var(--pink)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
.tile{display:flex;flex-direction:column;gap:12px;min-width:0}
.tile .sq{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--surf2)}
.tile .frame{transition:transform .1s steps(2)}
.tile:hover .frame,.tile:focus-visible .frame{transform:translate(-4px,-4px)}
.tile:focus-visible{outline:none}
.tile b{font-weight:normal;line-height:1.3}
.tile small{display:block;font-size:16px;color:var(--ink3);margin-top:-8px}
.empty{width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink3);background:transparent;
  background-image:repeating-linear-gradient(90deg,var(--surf2) 0 8px,transparent 8px 16px),repeating-linear-gradient(90deg,var(--surf2) 0 8px,transparent 8px 16px),repeating-linear-gradient(0deg,var(--surf2) 0 8px,transparent 8px 16px),repeating-linear-gradient(0deg,var(--surf2) 0 8px,transparent 8px 16px);
  background-size:100% 4px,100% 4px,4px 100%,4px 100%;background-position:0 0,0 100%,0 0,100% 0;background-repeat:no-repeat}
.empty i{font-style:normal;font-size:32px;color:var(--surf2)}
.bar{width:60%;height:12px;background:var(--surf2);position:relative;overflow:hidden}
.bar::after{content:'';position:absolute;inset:0;width:40%;background:var(--mint);animation:load 2.4s steps(6) infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.tile.soon b{color:var(--ink3)}

nav{display:flex;padding:8px;gap:8px}
nav a{flex:1 1 0;min-width:0;text-align:center;padding:8px 0;color:var(--ink2)}
nav a i{font-style:normal;color:var(--ink3);margin-right:4px}
nav a:hover,nav a:focus-visible{background:var(--surf2);color:var(--ink);outline:none}
nav a:hover i,nav a:focus-visible i{color:var(--yel)}
footer{text-align:center;color:var(--ink3);margin-top:-12px}
@media (max-width:380px){.brand h1{font-size:24px}.feat h2{font-size:24px}.grid{gap:24px 18px}}
@media (prefers-reduced-motion:reduce){.feat,.tile .frame{transition:none}.talk .caret,.bar::after{animation:none}}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=GAMES.slice().sort((a,b)=>b.no-a.no);
const href=g=>g.url?esc(g.url):'/'+encodeURIComponent(g.slug)+'/';
const img=(g,cls)=>g.thumb?`<img class="${cls}" src="${esc(g.thumb)}" alt="${esc(g.title)} 화면" loading="lazy">`:`<div class="${cls}"></div>`;
function feat(g){const tags=(g.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<a class="feat px" href="${href(g)}">${img(g,'shot')}<div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p><div class="row"><div class="tags">${tags}</div><span class="start">▶ START</span></div></div></a>`;}
function tile(g){return `<a class="tile" href="${href(g)}"><div class="frame px">${img(g,'sq')}</div><b>${esc(g.title)}</b><small>#${esc((g.tags||[])[0]||'')}</small></a>`;}
document.getElementById('count').textContent=String(list.length).padStart(2,'0');
if(list.length)document.getElementById('today').innerHTML=feat(list[0]);
const past=list.slice(1).map(tile);
past.push(`<div class="tile soon"><div class="empty"><i>?</i><div class="bar"></div></div><b>다음 게임 만드는 중</b></div>`);
document.getElementById('past').innerHTML=past.join('');
if(INSTA){const a=document.createElement('a');a.href='https://instagram.com/'+INSTA;a.target='_blank';a.rel='noopener';a.innerHTML='<i>@</i>'+esc(INSTA);document.getElementById('nav').appendChild(a);}
