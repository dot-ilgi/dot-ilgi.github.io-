<style>
/* 파스텔 일기장: 크림 모눈 바탕, 갈색 픽셀 테두리, 일기장 마스코트 */
:root{
  --bg:#fff8ee; --card:#ffffff; --ink:#5a3f36; --ink-2:#8a6d60; --line:#5a3f36;
  --pink:#ff8fab; --pink-2:#ffd6e0; --yellow:#ffd45a; --yellow-2:#fff1b8; --sky:#8fd3ff; --sky-2:#cfe8ff; --mint:#a8e6cf;
  --head:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(rgba(255,143,171,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(143,211,255,.14) 1px,transparent 1px);
  background-size:24px 24px;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
img.px{image-rendering:pixelated}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:6px}
.coin{width:112px;height:112px;animation:bob 2.4s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-family:var(--head);font-weight:400;font-size:44px;line-height:1.1;margin:6px 0 0;letter-spacing:.02em;text-shadow:3px 3px 0 var(--pink-2)}
.tag{margin:0;color:var(--ink-2);font-size:15px}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--yellow-2);border:2px solid var(--line);padding:2px 12px;font-family:var(--head);font-size:15px;box-shadow:3px 3px 0 var(--line)}
.streak b{font-weight:400;color:#d4561e;font-variant-numeric:tabular-nums}

.label{font-family:var(--head);font-size:20px;margin:0 0 -8px;display:flex;align-items:center;gap:8px}
.label::before{content:"";width:12px;height:12px;background:var(--pink);box-shadow:3px 3px 0 var(--line)}
.coin{filter:drop-shadow(4px 4px 0 rgba(90,63,54,.18))}

.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);transition:transform .12s,box-shadow .12s}
.card:hover,.card:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line);outline:none}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sky-2);border-bottom:3px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.no{position:absolute;top:10px;left:10px;background:var(--yellow);border:2px solid var(--line);font-family:var(--head);padding:0 10px;font-size:15px;font-variant-numeric:tabular-nums}
.new{position:absolute;top:10px;right:10px;background:var(--pink);color:#fff;border:2px solid var(--line);font-family:var(--head);padding:0 10px;font-size:15px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.title{font-family:var(--head);font-size:24px;line-height:1.25;margin:0;text-wrap:balance}
.desc{margin:0;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.chip{font-size:12px;border:2px solid var(--line);padding:0 8px;background:var(--mint)}
.chip:nth-child(2n){background:var(--sky-2)}
.date{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.play{margin-top:8px;align-self:stretch;text-align:center;background:var(--pink);color:#fff;font-family:var(--head);font-size:19px;padding:8px;border:3px solid var(--line);box-shadow:3px 3px 0 var(--line)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .title{font-size:17px}
.grid .body{padding:10px 12px 12px;gap:2px}
.grid .desc{display:none}
.grid .no{font-size:13px;top:6px;left:6px;padding:0 6px}
.soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:200px;border:3px dashed var(--ink-2);background:rgba(255,255,255,.6);color:var(--ink-2);font-family:var(--head);font-size:16px;padding:16px}
.soon .lock{font-size:30px;line-height:1}
footer{text-align:center;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center}
footer a{color:var(--ink);font-family:var(--head);font-size:16px}
@media (prefers-reduced-motion:reduce){.coin,.new{animation:none}.card{transition:none}}
</style>
</head>

  </section>

  <footer id="foot">
    <span>새 페이지가 열리면 맨 위에 올라와요</span>
  </footer>
</div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=GAMES.slice().sort((a,b)=>b.no-a.no);
const pad=n=>'p.'+String(n).padStart(3,'0');
const fmt=d=>{const [y,m,dd]=d.split('-');const w='일월화수목금토'[new Date(+y,+m-1,+dd).getDay()];return `${+m}월 ${+dd}일 ${w}요일`;};
function thumb(g,isNew){const img=g.thumb?`<img src="${esc(g.thumb)}" alt="${esc(g.title)} 화면" loading="lazy">`:`<div style="width:100%;height:100%;display:grid;place-items:center;font-size:48px">🎮</div>`;
  return `<div class="thumb">${img}<span class="no">${pad(g.no)}</span>${isNew?'<span class="new">NEW</span>':''}</div>`;}
function card(g,big){const tags=(g.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  return `<a class="card" href="/${encodeURIComponent(g.slug)}/">${thumb(g,big)}<div class="body"><h2 class="title">${esc(g.title)}</h2>${big?`<p class="desc">${esc(g.desc)}</p>`:''}<div class="meta">${tags}<span class="date">${fmt(g.date)}</span></div>${big?'<span class="play">▶ 페이지 펼치기</span>':''}</div></a>`;}
document.getElementById('count').textContent=list.length;
if(list.length){document.getElementById('today').innerHTML=card(list[0],true);}
const past=list.slice(1).map(g=>card(g,false));
past.push(`<div class="soon"><span class="lock">✏️</span>다음 장 쓰는 중…</div>`);
if(past.length%2)past.push(`<div class="soon"><span class="lock">✨</span>곧 열려요</div>`);
document.getElementById('past').innerHTML=past.join('');
if(INSTA){const f=document.getElementById('foot');const a=document.createElement('a');a.href='https://instagram.com/'+INSTA;a.textContent='@'+INSTA;a.target='_blank';a.rel='noopener';f.prepend(a);}
