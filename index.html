<style>
/* 게임기 홈 화면: 어두운 바탕, 앰버 포인트, 오늘 게임은 선택된 타일처럼 */
:root{
  --bg:#14161b; --surf:#1e2128; --surf2:#2a2e37; --line:#343842; --ink:#f2f3f5; --ink2:#b9bec8; --ink3:#9aa0ab; --dim:#6b717d;
  --amber:#ffb020;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --px:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;letter-spacing:-.01em;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--amber);display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:30px;height:30px;image-rendering:pixelated}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--ink3)}
.count{font-family:var(--px);font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.eyebrow{font-family:var(--px);font-size:12px;letter-spacing:.08em;color:var(--amber);margin:0 0 12px}
.feat{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:var(--surf);box-shadow:0 0 0 3px var(--amber),0 0 0 7px var(--bg),0 0 0 8px var(--line);transition:transform .15s}
.feat:hover,.feat:focus-visible{transform:translateY(-2px);outline:none}
.feat:active{transform:scale(.99)}
.shot{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;image-rendering:pixelated;background:var(--surf2)}
.feat .body{display:flex;flex-direction:column;gap:8px;padding:18px 18px 20px}
.feat h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1.15;text-wrap:balance}
.feat p{margin:0;font-size:14px;color:var(--ink2);word-break:keep-all}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--ink2);background:var(--surf2);border-radius:6px;padding:2px 8px}
.start{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 8px;background:var(--amber);color:var(--bg);border-radius:999px;font-size:15px;font-weight:700}
.start i{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--amber);display:grid;place-items:center;font-style:normal;font-family:var(--px);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.head span{font-size:12px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.tile{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .sq{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;display:block;background:var(--surf2);transition:box-shadow .15s}
.tile:hover .sq,.tile:focus-visible .sq{box-shadow:0 0 0 3px var(--amber)}
.tile:focus-visible{outline:none}
.tile b{font-size:15px;font-weight:600;line-height:1.3;padding:0 2px}
.tile small{display:block;font-size:12px;color:var(--ink3);padding:0 2px;margin-top:-6px}
.empty{width:100%;aspect-ratio:1/1;border-radius:16px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#7d838f;font-size:12px}
.empty i{font-style:normal;font-family:var(--px);font-size:20px;color:#5b616d}
.tile.soon b{color:#5b616d;font-family:var(--px);font-weight:400;font-size:13px}
nav{display:flex;gap:10px;padding:10px;background:var(--surf);border-radius:22px}
nav a{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;color:var(--ink2);font-size:12px;font-weight:600}
nav a:first-child{background:var(--surf2);color:var(--ink)}
nav a i{font-style:normal;font-family:var(--px);font-size:14px;color:var(--ink3)}
nav a:first-child i{color:var(--amber)}
nav a:hover{color:var(--ink)}
nav a:focus-visible,.feat:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
footer{text-align:center;font-size:12px;color:var(--dim);margin-top:-14px}
@media (prefers-reduced-motion:reduce){.feat,.tile .sq{transition:none}}
</style>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=GAMES.slice().sort((a,b)=>b.no-a.no);
const href=g=>g.url?esc(g.url):'/'+encodeURIComponent(g.slug)+'/';
const img=(g,cls)=>g.thumb?`<img class="${cls}" src="${esc(g.thumb)}" alt="${esc(g.title)} 화면" loading="lazy">`:`<div class="${cls}"></div>`;
function feat(g){const tags=(g.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<a class="feat" href="${href(g)}">${img(g,'shot')}<div class="body"><h1>${esc(g.title)}</h1><p>${esc(g.desc)}</p><div class="row"><div class="tags">${tags}</div><span class="start"><i>A</i>시작</span></div></div></a>`;}
function tile(g){return `<a class="tile" href="${href(g)}">${img(g,'sq')}<b>${esc(g.title)}</b><small>${esc((g.tags||[])[0]||'')}</small></a>`;}
document.getElementById('count').textContent=list.length;
if(list.length)document.getElementById('today').innerHTML=feat(list[0]);
const past=list.slice(1).map(tile);
const nextNo='p.'+String((list[0]?list[0].no:0)+1).padStart(3,'0');
past.push(`<div class="tile soon"><div class="empty"><i>+</i>다음 게임 로딩 중</div><b>${nextNo}</b></div>`);
document.getElementById('past').innerHTML=past.join('');
if(INSTA){const a=document.createElement('a');a.href='https://instagram.com/'+INSTA;a.target='_blank';a.rel='noopener';a.innerHTML='<i>@</i>'+esc(INSTA);document.getElementById('nav').appendChild(a);}
