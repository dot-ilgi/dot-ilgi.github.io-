<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="면접 8분 전, 회사에서 벌어지는 나와의 싸움. 포기와 진행 사이를 오가는 도트 게임.">
<meta property="og:title" content="포기하겠습니다">
<meta property="og:description" content="면접 8분 전, 회사에서 벌어지는 나와의 싸움">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>포기하겠습니다</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a quiet handheld — status row, portrait 3:4 pixel lobby, joystick + A below. Muted office palette, single light look. */
:root{
  --bg:#e7e9ed; --surface:#fbfbfc; --ink:#1f232b; --sub:#6b7180; --line:#d9dce2; --soft:#f1f2f5;
  --go:#3f5bc4; --pogi:#cf604b; --ok:#4f9a80; --hi:#efe3bf;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 26px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.device{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:12px 12px 14px;box-shadow:0 24px 48px -28px rgba(20,24,32,.45),0 2px 0 rgba(255,255,255,.8) inset}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 6px 6px;font-size:13px;color:var(--sub);font-weight:500}
.status .clock{font-family:var(--f-mono);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.st-r{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cour{display:inline-flex;gap:3px;align-items:center;margin-left:4px}
.cour i{width:7px;height:12px;border-radius:2px;background:var(--line)}
.cour i.on{background:var(--ok)}
.cour i.need{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px #b9bdc6}
.flipc{font-family:var(--f-mono);color:var(--pogi);font-weight:500}
.bag{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 6px 10px;font-size:12px;color:var(--sub);font-weight:500}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--surface);color:var(--ink)}
.chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.chip.no{color:#a6abb5;border-style:dashed}
.chip.no::before{background:var(--line)}
.screen{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;background:#fff;border:1px solid #c9cdd5}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.noti{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:10px;align-items:center;background:rgba(251,251,252,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 8px 20px -10px rgba(20,24,32,.35);transition:transform .25s ease,opacity .25s;font-size:13px;z-index:3}
.noti.off{transform:translateY(-130%);opacity:0}
.noti .ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
.noti .ic.me{background:var(--go)} .noti .ic.hr{background:var(--pogi)} .noti .ic.mom{background:var(--ok)}
.noti b{display:block;font-weight:500;font-size:11px;color:var(--sub)}
.noti span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.noti>div{min-width:0}
.place{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(31,35,43,.82);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.place.off{opacity:0}
.dlg{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(251,251,252,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px -14px rgba(20,24,32,.45);padding:12px 14px;cursor:pointer;z-index:2}
.who{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px;letter-spacing:0}
.who.me{color:var(--go)} .who.hr{color:var(--pogi)}
.txt{font-size:clamp(15px,4.1vw,17px);font-weight:500;line-height:1.55;white-space:pre-wrap;min-height:3.1em;word-break:keep-all}
.next{position:absolute;right:14px;bottom:10px;color:var(--sub);font-size:11px;animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(2px)}}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px;transition:opacity .25s}
.choices.locked{opacity:.35;pointer-events:none}
.cbtn{font:inherit;font-size:clamp(14px,3.9vw,16px);font-weight:500;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cbtn::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#c3c7cf}
.cbtn.go::before{background:var(--go)} .cbtn.pg::before{background:var(--pogi)}
.cbtn.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.cbtn.sel::after{content:"한 번 더 누르면 결정";margin-left:auto;font-size:11px;font-weight:400;opacity:.65;white-space:nowrap}
.cbtn:focus-visible,.big:focus-visible,.ibtn:focus-visible,.abtn:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.phone{position:absolute;inset:0;background:#f3f4f7;display:flex;flex-direction:column;z-index:4}
.ph-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.ph-h button{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:4px 10px}
.ph-b{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500}
.bub{max-width:80%;padding:8px 11px;border-radius:16px;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--go);color:#fff;border-bottom-right-radius:5px}
.bub.hr{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub small{display:block;font-family:var(--f-mono);font-size:10px;opacity:.6;margin-top:2px}
.ph-empty{color:var(--sub);text-align:center;margin:auto}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:22px;background:linear-gradient(180deg,#f7f8fa,#eceef2);z-index:5}
.ttl{font-size:clamp(32px,10vw,46px);font-weight:700;line-height:1.05;letter-spacing:-.045em}
.ttl.pg{color:var(--pogi)} .ttl.go{color:var(--go)}
.ttl-sm{font-size:clamp(23px,7vw,32px)}
.sub{color:var(--sub);font-size:clamp(13px,3.6vw,15px);font-weight:500;max-width:28ch;line-height:1.5;word-break:keep-all}
.big{font:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:12px;padding:11px 20px;cursor:pointer;transition:transform .1s}
.big.alt{background:var(--surface);color:var(--ink);border-color:var(--line)}
.big:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.eno{font-family:var(--f-mono);color:var(--sub);font-size:12px;letter-spacing:.14em}
.slots{width:100%;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:500;color:#9aa0aa;text-align:left;padding:0 4px}
.slots span{display:flex;gap:6px;min-width:0}
.slots i{font-style:normal;color:#b3b8c1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots .got{color:var(--ink)}
.fade{position:absolute;inset:0;background:#f7f8fa;opacity:0;pointer-events:none;transition:opacity .35s;z-index:3}
.fade.on{opacity:1}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 6px 2px;touch-action:none}
.stick{position:relative;width:120px;height:120px;border-radius:50%;background:var(--soft);box-shadow:inset 0 2px 6px rgba(20,24,32,.12);border:1px solid var(--line);touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 6px 14px -4px rgba(20,24,32,.35);pointer-events:none}
.knob::after{content:"";position:absolute;inset:19px;border-radius:50%;background:var(--soft)}
.side{display:flex;flex-direction:column;align-items:center;gap:10px}
.abtn{width:74px;height:74px;border-radius:50%;font:inherit;font-size:20px;font-weight:600;color:#fff;background:var(--ink);border:0;box-shadow:0 8px 16px -6px rgba(20,24,32,.5);cursor:pointer;touch-action:none;transition:transform .08s}
.abtn:active{transform:scale(.94)}
.minis{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:180px}
.goal{display:flex;gap:8px;align-items:center;padding:0 6px 10px;font-size:13px;font-weight:600;min-width:0}
.goal::before{content:"할 일";flex:none;font-size:11px;font-weight:500;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.goal span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen.shake canvas{animation:shake .32s linear}
@keyframes shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
.ov.end{justify-content:flex-start;overflow-y:auto;gap:10px;padding:14px}
.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 12px 26px -16px rgba(20,24,32,.4);display:flex;flex-direction:column;gap:6px}
.card .ttl-sm{font-size:clamp(22px,6.6vw,30px)}
.card .sub{max-width:none}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:6px 0 2px;padding-top:10px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;min-width:0}
.stats dt{font-size:11px;color:var(--sub);font-weight:500}
.stats dd{margin:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.grade{align-self:flex-start;font-size:12px;font-weight:600;color:#fff;background:var(--ink);border-radius:999px;padding:3px 10px}
.cap{font-size:11px;color:var(--sub)}
.ibtn{font:inherit;font-size:12px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--pogi);color:#fff;font-size:10px;font-weight:600;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px}
.help{color:var(--sub);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){.next{animation:none}.fade,.noti,.place,.choices{transition:none}}
</style>

</head>
<body>
<main class="wrap">
  <div class="device">
    <div class="status">
      <span class="clock" id="clock">13:52</span>
      <span class="st-r">
        <span>용기 <span class="cour" id="cour"><i></i><i></i><i></i><i></i><i></i></span></span>
        <span>번복 <span class="flipc" id="flips">0</span>/8</span>
      </span>
    </div>
    <div class="bag" id="bag"></div>
    <div class="goal"><span id="goal"></span></div>
    <div class="screen" id="screen">
      <canvas id="cv"></canvas>
      <div class="place off" id="place">1층 로비</div>
      <div class="noti off" id="noti"><div class="ic me" id="notiIc">나</div><div><b id="notiWho">보낸 문자</b><span id="notiTxt"></span></div></div>
      <div class="dlg" id="dlg" hidden>
        <span class="who" id="who" hidden></span>
        <div class="txt" id="txt"></div>
        <div class="choices" id="choices" hidden></div>
        <span class="next" id="nextArrow" hidden>▼</span>
      </div>
      <div class="phone" id="phone" hidden>
        <div class="ph-h"><span>인사팀 김대리</span><button id="phClose" type="button">닫기</button></div>
        <div class="ph-b" id="phBody"></div>
      </div>
      <div class="fade" id="fade"></div>
      <div class="ov" id="titleOv">
        <div class="ttl pg" id="ttlWord">포기하겠습니다</div>
        <div class="sub">면접 8분 전, 회사에서 벌어지는 나와의 싸움</div>
        <button class="big" id="startBtn" type="button">시작하겠습니다</button>
        <div class="sub" id="titleCount"></div>
      </div>
      <div class="ov end" id="endOv" hidden>
        <div class="card">
          <div class="eno" id="eNo">ENDING 1 / 8</div>
          <div class="ttl ttl-sm" id="eName"></div>
          <div class="sub" id="eLine"></div>
          <dl class="stats" id="stats"></dl>
          <div class="grade" id="grade"></div>
          <div class="cap">포기하겠습니다 · 캡처해서 자랑하겠습니다.. 아니</div>
        </div>
        <div class="slots" id="slots"></div>
        <div class="row">
          <button class="big" id="againBtn" type="button">다시 하겠습니다</button>
          <button class="big alt" id="quitBtn" type="button">포기하겠습니다</button>
        </div>
      </div>
    </div>
    <div class="ctrl">
      <div class="stick" id="stick" aria-label="조이스틱"><div class="knob" id="knob"></div></div>
      <div class="side">
        <button class="abtn" id="aBtn" type="button">A</button>
        <div class="minis">
          <button class="ibtn" id="phoneBtn" type="button">폰<span class="badge" id="badge" hidden>0</span></button>
          <button class="ibtn" id="muteBtn" type="button">BGM 켬</button>
          <button class="ibtn" id="fastBtn" type="button">빨리감기 끔</button>
        </div>
      </div>
    </div>
  </div>
  <p class="help">조이스틱으로 이동 · 느낌표 뜨면 A · 선택지는 한 번 골라서, 한 번 더 눌러 결정<br><a href="../" style="color:inherit">도트일기 다른 게임</a></p>
</main>

<script>
(()=>{
const W=9,H=12,T=16,NEED=4;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W*T;cv.height=H*T;ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];

const MAPS={
 lobby:["WWWWWWWWW","WMWWVWWPW","....r....","Q...r.KKK","....r....","....r....","....r...A","....r....","T...r...T","..hhr....","....r....","WWWWEWWWW"],
 f7:["WWWWWWWWW","WWWWDWWMW","....r....","X...r....","....r..CC","....r....","hh..r....","....r....","T...r...F","....r....","....r....","WWWWvWWWW"],
 room:["WWWWWWWWW","WWWBWWWWW",".........","..KKKKK..",".........","....h....",".........",".........",".........",".........",".........","WWWWWWWWW"]
};
const PLACE={lobby:'1층 로비',f7:'7층 면접 대기실',room:'7층 면접실'};
const WALK='.rEv';
const IVB={hair:'#1e1a26',shirt:'#8c5468',legs:'#222'};
const ENTS={
 lobby:[{id:'recep',x:7,y:2,dir:'down',hair:'#5a2b1f',shirt:'#6fa58f',legs:'#2a3a4f'},
        {id:'appl',x:3,y:9,dir:'left',hair:'#c9852b',shirt:'#e8e8f0',tie:'#4a64b8',legs:'#2a3a4f',sit:1}],
 f7:[{id:'staff',x:5,y:2,dir:'down',hair:'#333',shirt:'#e2c27a',legs:'#2a3a4f'},
     {id:'senior',x:8,y:5,dir:'left',hair:'#7a4a2a',shirt:'#9a92c4',legs:'#2a3a4f'},
     {id:'career',x:1,y:6,dir:'right',hair:'#555',shirt:'#e8e8f0',tie:'#6fa58f',legs:'#2a3a4f',sit:1}],
 room:[{id:'iv1',x:3,y:2,dir:'down',hair:'#a8a8b8',shirt:'#3b4a6b',legs:'#222'},
       {id:'iv2',x:5,y:2,dir:'down',...IVB}]
};
const ENDINGS=[
 {k:'brave',name:'결단력 만렙',line:'문자 한 통으로 끝냈다. 사내 전설 "그 지원자"가 되었다.',hint:'문 앞에서 딱 한 통만 보내면…'},
 {k:'pass',name:'합격하겠습니다.. 아니',line:'붙었다. 근데 인사팀도 세 번 번복했다. 결정장애는 전염된다.',hint:'번복해도 면접만 잘 보면'},
 {k:'intern',name:'인턴하겠습니다.. 아니',line:'정규직은 아니지만 일단 붙었다. 아마도.',hint:'면접관 눈 밖에 나면…'},
 {k:'home',name:'다음 공채에서 만나요',line:'집에 가는 지하철에서 또 번복했다.',hint:'로비 자동문 밖으로'},
 {k:'L',name:'L을 가져가',line:'인사팀이 먼저 포기했다. 아니 진행했나? 아니 포기했다.',hint:'인사팀 인내심은 8통까지'},
 {k:'gap',name:'갑차기스러운 퇴근',line:'오타 세 번에 회사 전체가 퇴근했다. 오늘의 MVP.',hint:'오타는 세 번까지'},
 {k:'elev',name:'층간 번복',line:'엘리베이터까지 결정장애에 걸렸다. 수리비는 회사가 냈다.',hint:'엘리베이터 버튼을 자꾸 바꾸면'},
 {k:'snack',name:'탕비실 정규직',line:'면접은 안 봤는데 탕비실 담당으로 취직했다. 과자는 무제한.',hint:'탕비실 과자를 좋아하면…'}
];

let S,scene='title',busy=false,tt=0,lastSend=0;
let got=new Set();
try{(JSON.parse(localStorage.getItem('pogi3-endings')||'[]')).forEach(k=>got.add(k));}catch(e){}
const saveGot=()=>{try{localStorage.setItem('pogi3-endings',JSON.stringify([...got]))}catch(e){}};
const isMap=()=>scene==='lobby'||scene==='f7';
let SEEN=new Set();try{(JSON.parse(localStorage.getItem('pogi3-seen')||'[]')).forEach(k=>SEEN.add(k));}catch(e){}
const saveSeen=()=>{try{localStorage.setItem('pogi3-seen',JSON.stringify([...SEEN].slice(-600)))}catch(e){}};
addEventListener('pagehide',saveSeen);
let FAST=got.size>0;

function reset(){
  S={x:4*T+8,y:7*T+12,dir:'up',dist:0,moving:false,courage:0,flags:{},items:{},msgs:[],me:0,gap:0,unread:0,
     snack:0,print:0,elevFloor:7,withB:false,elevMeet:undefined,start:performance.now(),score:null,emotes:[],anim:0,been7:false};
  scene='lobby';renderHud();renderPhone();
}

/* ---------- audio: soft chimes + chiptune BGM (no noise) ---------- */
let actx=null,master=null,lp=null,soundOn=true;
function initAudio(){
  if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();master.gain.value=soundOn?1:0;lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  lp.connect(master);master.connect(actx.destination);}catch(e){actx=null}
}
function note(f,t,d,type='triangle',vol=.08){
  if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);

  if(FAST&&seen){D.i=text.length;finishType();if(!choices){D.autoT=setTimeout(()=>{if(D.open&&!D.choices&&D.full===text)advance(false);},420);}return;}
  D.timer=setInterval(()=>{D.i++;$('txt').textContent=D.full.slice(0,D.i);if(D.i>=D.full.length)finishType();},FAST?12:26);
}
function finishType(){
  clearInterval(D.timer);D.typing=false;$('txt').textContent=D.full;D.readyAt=performance.now()+(D.choices?650:220);
  if(D.choices){const c=$('choices');c.innerHTML='';c.hidden=false;c.classList.add('locked');
    clearTimeout(D.lockT);D.lockT=setTimeout(()=>c.classList.remove('locked'),650);
    D.choices.forEach((o,i)=>{const b=document.createElement('button');b.type='button';
      b.className='cbtn'+(/포기|집에|반대/.test(o)?' pg':/진행|남겠|그대로/.test(o)?' go':'');b.textContent=o;
      b.onclick=e=>{e.stopPropagation();choose(i)};c.appendChild(b);});markSel();
  } else $('nextArrow').hidden=false;
}
const ready=()=>performance.now()>=D.readyAt;
function choose(i){ if(!D.open||D.typing||!ready())return; if(D.sel!==i){D.sel=i;markSel();selSfx();return;} pick(i); }
function markSel(){[...$('choices').children].forEach((b,i)=>b.classList.toggle('sel',i===D.sel));}
function pick(i){if(!D.open||D.typing||i<0)return;selSfx();const cb=D.cb;D.open=false;D.cb=null;cb&&cb(i);}
function advance(fromBox){
  if(!D.open)return;
  if(D.typing){D.i=D.full.length;finishType();return;}
  if(!ready())return;
  if(D.choices){ if(fromBox)return; if(D.sel<0){D.sel=0;markSel();selSfx();return;} pick(D.sel);return;}
  const cb=D.cb;D.open=false;D.cb=null;cb&&cb();

/* ---------- movement (free, joystick) ---------- */
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function solidPt(px,py){
  const tx=Math.floor(px/T),ty=Math.floor(py/T);
  if(tx<0||ty<0||tx>=W||ty>=H)return true;
  if(!WALK.includes(MAPS[scene][ty][tx]))return true;
  return ENTS[scene].some(e=>px>=e.x*T+2&&px<=e.x*T+14&&py>=e.y*T+4&&py<=e.y*T+16);
}
const blocked=(x,y)=>solidPt(x-4,y-4)||solidPt(x+4,y-4)||solidPt(x-4,y)||solidPt(x+4,y);
function target(){
  const [dx,dy]=DV[S.dir],px=S.x+dx*11,py=S.y-3+dy*11;
  const tx=Math.floor(px/T),ty=Math.floor(py/T);
  if(tx<0||ty<0||tx>=W||ty>=H)return null;
  const e=ENTS[scene].find(e=>e.x===tx&&e.y===ty);
  if(e)return{x:tx,y:ty,k:e.id};
  const c=MAPS[scene][ty][tx];
  if(SC[scene][c]&&c!=='E'&&c!=='v')return{x:c==='K'?7:tx,y:c==='K'?2:ty,k:c};
  return null;
}
const joy={x:0,y:0};const keys={};
function update(dt){
  hint=null;
  if(!isMap()||!S)return;
  if(!busy&&S.me>0&&!S.flags.idle&&performance.now()-lastSend>25000){S.flags.idle=1;run(async()=>{hr('연락 없네… 잘 살아.');await wait(1400);hr('아 아니에요 기다릴게요..');});return;}
  if(busy){S.moving=false;return;}
  let vx=joy.x,vy=joy.y;
  const kx=(keys.right?1:0)-(keys.left?1:0),ky=(keys.down?1:0)-(keys.up?1:0);
  if(kx||ky){vx=kx;vy=ky;}
  let mag=Math.hypot(vx,vy);
  if(mag<.25){S.moving=false;hint=target();return;}
  if(mag>1){vx/=mag;vy/=mag;}
  S.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?'right':'left'):(vy>0?'down':'up');
  const sp=60*dt/1000,ox=S.x,oy=S.y,nx=S.x+vx*sp,ny=S.y+vy*sp;
  if(!blocked(nx,S.y))S.x=nx;
  if(!blocked(S.x,ny))S.y=ny;
  const moved=Math.hypot(S.x-ox,S.y-oy);S.dist+=moved;S.moving=moved>.01;
  hint=target();
  const c=MAPS[scene][Math.floor((S.y-2)/T)][Math.floor(S.x/T)];
  if(c==='E'||c==='v'){joy.x=joy.y=0;centerKnob();for(const k in keys)keys[k]=false;run(SC[scene][c]);}
}
function interact(){
  if(busy||!isMap())return;
  const t=target();if(!t)return;
  run(SC[scene][t.k]);
}

const stick=$('stick'),knob=$('knob');let sp=null;
function centerKnob(){knob.style.transform='';}
function stickMove(ev){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;
  let dx=ev.clientX-cx,dy=ev.clientY-cy;const m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/max;joy.y=dy/max;
  if(D.open&&D.choices&&!D.typing){const now=performance.now();if(Math.abs(joy.y)>.6&&(!stickMove.t||now-stickMove.t>260)){stickMove.t=now;moveSel(joy.y>0?1:-1);}}
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();sp=e.pointerId;try{stick.setPointerCapture(e.pointerId)}catch(_){}stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sp)stickMove(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>stick.addEventListener(n,e=>{if(e.pointerId!==sp)return;sp=null;joy.x=joy.y=0;centerKnob();stickMove.t=0;}));
function moveSel(d){if(!ready())return;const n=D.choices.length;D.sel=D.sel<0?(d>0?0:n-1):(D.sel+d+n)%n;markSel();selSfx();}
