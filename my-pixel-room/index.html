<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<style>

img.pt{display:block;image-rendering:pixelated;pointer-events:none}
.pb{background:var(--p);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 6px 0 0 #3a2e4455,3px 3px 0 0 #3a2e4455;margin:3px}

.groups{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.gb{display:flex}
.col{display:flex;flex-direction:column}

#mtxt{position:absolute;bottom:84px}

#msave{--p:#fff3b8;padding:8px 22px}

<script>
// ===== PIXEL ROOM CORE =====
const S=80,WT=2,FT=2,WH=58,GX=S+2*WT,GY=GX,GZ=FT+WH;
const FLAG=1<<24;
const R=c=>(c>>16)&255,Gc=c=>(c>>8)&255,Bc=c=>c&255;
const cl=v=>v<0?0:v>255?255:v|0;
const rgb=(r,g,b)=>(cl(r)<<16)|(cl(g)<<8)|cl(b);
const sh=(c,k)=>rgb(R(c)*k,Gc(c)*k,Bc(c)*k);
const mix=(a,b,t)=>rgb(R(a)+(R(b)-R(a))*t,Gc(a)+(Gc(b)-Gc(a))*t,Bc(a)+(Bc(b)-Bc(a))*t);
const lt=(c,t)=>mix(c,0xffffff,t),dk=(c,t)=>mix(c,0,t);
function hash(x,y,z){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1440662683))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const PAL=[0xe8505b,0xf7a541,0xf9d65c,0x6cc08b,0x4aa3df,0x8e6fd8,0xf27fb2,0x3d3a4b,0xf3efe6,0x5fb7b0,0xc0583a,0x2f6f9f];
const T={
 fab:(c,a=.05)=>(x,y,z)=>sh(c,1-a+2*a*hash(x,y,z)),
 wood:(c,ax=0)=>(x,y,z)=>{const al=ax==0?x:ax==1?y:z,cr=ax==0?y+z:ax==1?x+z:x+y;return sh(c,.9+.11*hash(cr,al>>3,3)+.05*Math.sin(cr*1.7+al*.23))},
 leather:c=>(x,y,z)=>sh(c,.93+.09*hash(x,y,z)),
 metal:c=>(x,y,z)=>sh(c,.94+.1*Math.sin((x+y+z)*.8)),
 rattan:c=>(x,y,z)=>{const a=(x+z+y)%3==0,b=((x-z+300)+y)%3==0;return a&&b?sh(c,.6):a||b?sh(c,.8):sh(c,1.04-.06*hash(x,y,z))},
 leopard:(c,sp)=>(x,y,z)=>{const u=x,v=y+z,cx=Math.floor(u/5),cy=Math.floor(v/5);let best=9,bx=0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const px=(cx+a)*5+1+hash(cx+a,cy+b,1)*3,py=(cy+b)*5+1+hash(cx+a,cy+b,2)*3,d=Math.hypot(u+.5-px,v+.5-py);if(d<best)best=d}return best<1?sh(c,.75):best<1.9?(sp||0x3a2618):sh(c,.97+.05*hash(x,y,z))},
 tuft:c=>(x,y,z)=>((x+z)%5==0&&(x-z+500)%5==0)?sh(c,.68):sh(c,.94+.07*hash(x,y,z)),
 stripe:(a,b,n=3,ax=0)=>(x,y,z)=>(Math.floor((ax==0?x:ax==1?y:z)/n)%2?a:b),
};
// ---------- builder ----------
function mkB(emit,lcb){
 const V=(x,y,z,c,m)=>{x=Math.floor(x);y=Math.floor(y);z=Math.floor(z);emit(x,y,z,typeof c==="function"?c(x,y,z):c,m||0)};
 const B={
  v:V,
  box(x,y,z,w,d,h,c,m){for(let k=z;k<z+h;k++)for(let j=y;j<y+d;j++)for(let i=x;i<x+w;i++)V(i,j,k,c,m)},
  cyl(cx,cy,z,r,h,c,m,ri,keep){const r2=r*r,q=ri?ri*ri:-1;for(let j=Math.floor(cy-r-1);j<=Math.ceil(cy+r);j++)for(let i=Math.floor(cx-r-1);i<=Math.ceil(cx+r);i++){const dx=i+.5-cx,dy=j+.5-cy,d=dx*dx+dy*dy;if(d<=r2&&d>=q)for(let k=z;k<z+h;k++)if(!keep||keep(i,j,k))V(i,j,k,c,m)}},
  ell(cx,cy,cz,rx,ry,rz,c,m,keep,shell){for(let k=Math.floor(cz-rz-1);k<=Math.ceil(cz+rz);k++)for(let j=Math.floor(cy-ry-1);j<=Math.ceil(cy+ry);j++)for(let i=Math.floor(cx-rx-1);i<=Math.ceil(cx+rx);i++){const a=(i+.5-cx)/rx,b=(j+.5-cy)/ry,e=(k+.5-cz)/rz,d=a*a+b*b+e*e;if(d<=1&&(!shell||d>=shell)&&(!keep||keep(i,j,k)))V(i,j,k,c,m)}},
  cone(cx,cy,z,r0,r1,h,c,m,hol){for(let k=0;k<h;k++){const r=r0+(r1-r0)*(h<2?0:k/(h-1));B.cyl(cx,cy,z+k,r,1,c,m,hol?Math.max(0,r-hol):0)}},
  line(x0,y0,z0,x1,y1,z1,c,m,r){const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0))*2)+1;for(let t=0;t<=n;t++){const f=t/n,x=x0+(x1-x0)*f,y=y0+(y1-y0)*f,z=z0+(z1-z0)*f;if(r&&r>=.9)B.ell(x,y,z,r,r,r,c,m);else V(x,y,z,c,m)}},
  bez(p0,p1,p2,c,m,r){let prev=p0;const n=30;for(let t=1;t<=n;t++){const f=t/n,g=1-f,p=[0,1,2].map(i=>g*g*p0[i]+2*g*f*p1[i]+f*f*p2[i]);B.line(prev[0],prev[1],prev[2],p[0],p[1],p[2],c,m,r);prev=p}},
  light(x,y,z,col,rad,pw){lcb&&lcb(x,y,z,col,rad||30,pw||1)}
 };

}
function bedding(B,x,y,w,d,z,m,pc=0xfbf8f2,two=true){
 B.box(x,y,z,w,d,4,T.fab(0xf4f1ea,.03));
 const by=y+Math.round(d*.3),D=typeof m=='function'?m:T.fab(m,.05),L=d-(by-y);
 B.box(x-1,by,z+4,w+2,L,2,D);
 B.box(x-1,by,z-1,1,L,5,D);B.box(x+w,by,z-1,1,L,5,D);
 B.box(x-1,y+d-1,z-1,w+2,1,5,D);
 B.box(x-1,by,z+6,w+2,3,1,typeof m=='function'?T.fab(0xfdfcf8,.03):T.fab(lt(m,.35),.04));
 const P=T.fab(pc,.03);
 if(two){B.ell(x+w*.27,y+4,z+5,w*.21,3,2.3,P);B.ell(x+w*.73,y+4,z+5,w*.21,3,2.3,P)}else B.ell(x+w/2,y+4,z+5,w*.38,3,2.3,P);
}
function pot(B,cx,cy,r,h,c,soil=0x5a3d2b){B.cone(cx,cy,0,r*.82,r,h-1,T.fab(c,.04));B.cyl(cx,cy,h-1,r+.6,1,sh(c,1.06));B.cyl(cx,cy,h-1,r-.6,1,T.fab(soil,.1))}
function leafy(B,cx,cy,cz,rx,ry,rz,c,dens,seed=1){B.ell(cx,cy,cz,rx,ry,rz,(x,y,z)=>sh(c,.78+.35*hash(x,y,z+seed)),0,(i,j,k)=>hash(i,j,k*7+seed)<dens)}
function heart(X,Y){const a=X*X+Y*Y-1;return a*a*a-X*X*Y*Y*Y<=0}
const BK=[0xc94c4c,0x3e6fa8,0xe0b84a,0x4f8a5b,0xe9e2d0,0x8b5aa8,0x2e2e3a,0xd8774a,0x7fb3c8,0xb84f7a];
const leg4=(B,w,d,h,c,t=2)=>{B.box(0,0,0,t,t,h,c);B.box(w-t,0,0,t,t,h,c);B.box(0,d-t,0,t,t,h,c);B.box(w-t,d-t,0,t,t,h,c)};
const GL=4; // glow mat
// ---------- items ----------
const DEFS=[
// ===== BED =====
{k:'bed_wood',n:'원목 침대',c:'bed',w:30,d:42,m:0xe9e1d3,s:0xb07d4f,f(B,m,s){const W=T.wood(s);leg4(B,30,42,2,sh(s,.8));B.box(0,0,2,30,42,5,W);B.box(0,0,0,30,3,24,T.wood(s,2));B.box(0,0,24,30,3,1,sh(s,1.08));bedding(B,1,3,28,39,7,m)}},
{k:'bed_gyaru',n:'갸루 하트 침대',c:'bed',w:30,d:42,m:0xf27fb2,s:0xe8c79a,f(B,m,s){const P=T.leather(m);leg4(B,30,42,2,0xf2c94c);B.box(0,0,2,30,42,5,P);for(let x=0;x<30;x++)for(let z=0;z<31;z++){if(z<8||heart((x+.5-15)/12.5,(z+.5-15)/12)){const edge=z>=8&&!(heart((x-1+.5-15)/12.5,(z+.5-15)/12)&&heart((x+1+.5-15)/12.5,(z+.5-15)/12)&&heart((x+.5-15)/12.5,(z+1.5-15)/12));B.box(x,0,z,1,3,1,edge?0xfff1a8:P)}}bedding(B,1,3,28,39,7,T.leopard(s),lt(m,.5));B.ell(15,8,13,4,1.5,3,T.fab(m,.03))}},
{k:'bed_cloud',n:'구름 침대',c:'bed',w:30,d:42,m:0xfafcff,s:0x9fd3f5,f(B,m,s){const C=T.fab(m,.03);[[6,8],[15,6],[24,8],[6,20],[24,20],[6,33],[15,36],[24,33],[15,21]].forEach(p=>B.ell(p[0],p[1],5,7,7,5,C,0,(i,j,k)=>k>=0&&j>=0&&j<42&&i>=0&&i<30));B.ell(7,3,14,6,2.5,6,C);B.ell(15,3,19,7,2.5,7,C);B.ell(23,3,14,6,2.5,6,C);B.box(3,4,7,24,35,3,T.fab(0xffffff,.02));B.box(2,16,10,26,23,2,T.fab(s,.05));B.box(2,16,12,26,3,1,T.fab(lt(s,.4),.04));B.ell(10,8,11,5,3,2.2,C);B.ell(20,8,11,5,3,2.2,C)}},
{k:'bed_canopy',n:'캐노피 침대',c:'bed',w:30,d:42,m:0xf3d9dc,s:0xfff6f0,f(B,m,s){const W=T.wood(0x7a4e33,2);[[0,0],[28,0],[0,40],[28,40]].forEach(p=>B.box(p[0],p[1],0,2,2,52,W));B.box(0,0,50,30,2,2,W);B.box(0,40,50,30,2,2,W);B.box(0,0,50,2,42,2,W);B.box(28,0,50,2,42,2,W);B.box(2,0,2,26,42,5,T.wood(0x7a4e33));B.box(2,0,7,26,2,15,T.wood(0x8a5a3c,2));bedding(B,2,3,26,38,7,m);for(let x=0;x<30;x++){const lz=46-Math.round(1.5+1.5*Math.sin(x*.7));for(let z=lz;z<50;z++){B.v(x,42,z,s,3)}}for(let y=0;y<42;y++){const lz=46-Math.round(1.5+1.5*Math.sin(y*.7));for(let z=lz;z<50;z++){B.v(30,y,z,s,3)}}for(let z=6;z<50;z++){for(let i=0;i<5;i++){const f=Math.sin(i*1.6+z*.08);B.v(2+i,41+(f>0?1:0),z,sh(s,.95+.05*f),3);B.v(23+i,41+(f>0?1:0),z,sh(s,.95+.05*f),3);B.v(29+(f>0?1:0),36+i,z,sh(s,.95+.05*f),3)}}}},
{k:'bed_bunk',n:'이층 침대',c:'bed',w:24,d:42,m:0x7fb3c8,s:0xd9b48a,f(B,m,s){const W=T.wood(s,2);[[0,0],[22,0],[0,40],[22,40]].forEach(p=>B.box(p[0],p[1],0,2,2,46,W));B.box(0,0,3,24,42,3,T.wood(s));B.box(0,0,24,24,42,2,T.wood(s));bedding(B,2,2,20,38,6,m,0xffffff,false);bedding(B,2,2,20,38,26,lt(m,.25)?mix(m,0xf2c94c,.5):m,0xffffff,false);B.box(0,0,35,24,2,2,W);B.box(0,40,35,24,2,2,W);B.box(22,0,35,2,28,2,W);B.box(22,28,0,2,1,40,W);B.box(22,35,0,2,1,40,W);for(let z=4;z<38;z+=5)B.box(23,29,z,1,6,1,sh(s,1.1))}},
{k:'bed_iron',n:'철제 침대',c:'bed',w:30,d:42,m:0xd9e4dc,s:0x2e2e36,f(B,m,s){const M=T.metal(s);[0,29].forEach(x=>{B.box(x,0,0,1,1,27,M);B.box(x,41,0,1,1,16,M);B.ell(x+.5,.5,27.5,1.1,1.1,1.1,0xd8b45a);B.ell(x+.5,41.5,16.5,1.1,1.1,1.1,0xd8b45a)});for(let x=2;x<29;x+=3){B.box(x,0,6,1,1,18,M);B.box(x,41,6,1,1,8,M)}B.box(0,0,24,30,1,1,M);B.box(0,0,6,30,1,1,M);B.box(0,41,14,30,1,1,M);B.box(0,41,6,30,1,1,M);B.box(0,1,5,1,40,1,M);B.box(29,1,5,1,40,1,M);bedding(B,1,1,28,39,6,m)}},
